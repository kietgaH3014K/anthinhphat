# Triển khai thật: PostgreSQL + Django (gunicorn) + nginx phục vụ React.
# Chạy: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - private_media:/app/private_media

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_GA_ID: ${VITE_GA_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media:/srv/media:ro

volumes:
  pgdata:
  media:
  private_media:
