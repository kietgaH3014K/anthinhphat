# Nếu có bộ cân bằng tải/Cloudflare đứng trước và đã xử lý HTTPS, giữ nguyên giao thức gốc cho Django
map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;   # file đính kèm báo giá tối đa 10 MB

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
  location /quan-tri-django/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
  location = /sitemap.xml { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
  location = /robots.txt { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
  location /static/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }

  # Ảnh sản phẩm (công khai). Thư mục private_media (file khách gửi) KHÔNG được gắn vào nginx.
  location /media/ { alias /srv/media/; expires 30d; access_log off; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
